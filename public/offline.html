<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>You’re offline · chneau.github.io</title>
		<meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
		<style>
		:root {
			color-scheme: light dark;
			--bg: #f4f4f5;
			--surface: #ffffff;
			--border: rgba(24, 24, 27, 0.1);
			--text: #18181b;
			--muted: #52525b;
			--accent: #4f46e5;
			--shadow: 0 1px 2px rgba(24, 24, 27, 0.06);
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #09090b;
				--surface: #121215;
				--border: rgba(255, 255, 255, 0.08);
				--text: #f4f4f5;
				--muted: #a1a1aa;
				--accent: #a5b4fc;
				--shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
			}
		}
		* {
			box-sizing: border-box;
		}
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			background: var(--bg);
			color: var(--text);
			font-family:
				"Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system,
				BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
			line-height: 1.5;
			text-align: center;
		}
		.wrap {
			width: 100%;
			max-width: 440px;
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: 18px;
			box-shadow: var(--shadow);
			padding: 40px;
		}
		.brand {
			margin: 0 0 12px;
			font-size: 0.72rem;
			font-weight: 700;
			letter-spacing: 0.14em;
			text-transform: uppercase;
			color: var(--muted);
		}
		.mark {
			font-size: 2.4rem;
		}
		h1 {
			margin: 10px 0 6px;
			font-size: 1.5rem;
			letter-spacing: -0.02em;
		}
		p {
			margin: 0 0 24px;
			color: var(--muted);
		}
		button {
			font: inherit;
			font-weight: 600;
			font-size: 0.9rem;
			cursor: pointer;
			padding: 9px 18px;
			border: 0;
			border-radius: 10px;
			background: var(--accent);
			color: var(--bg);
		}
		</style>
	</head>
	<body>
		<main class="wrap">
			<p class="brand">chneau.github.io</p>
			<div class="mark" aria-hidden="true">📡</div>
			<h1>You’re offline</h1>
			<p>This page needs a connection. Check your network and try again.</p>
			<button type="button" id="retry">Try again</button>
		</main>
		<script>
			document.getElementById("retry").addEventListener("click", () => {
				location.reload();
			});
		</script>
	</body>
</html>
